<style>
/* ===== SUZUKI POPUP PROMO - ISOLATED NAMESPACE ===== */
:root {
  --spp-bg: #0a0e1a;
  --spp-card: #141b2d;
  --spp-card-light: #1c2540;
  --spp-red: #E60012;
  --spp-red-dark: #c40010;
  --spp-gold: #d4a843;
  --spp-gold-light: #f0d078;
  --spp-success: #25d366;
  --spp-text: #ffffff;
  --spp-text-secondary: #cbd5e1;
  --spp-muted: #64748b;
  --spp-border: rgba(255,255,255,0.08);
  --spp-radius: 18px;
}

#spp-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 10, 20, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.45s ease, visibility 0.45s ease;
  padding: 16px;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
#spp-overlay.spp-active {
  opacity: 1;
  visibility: visible;
}

#spp-container {
  position: relative;
  max-width: 440px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  background: linear-gradient(165deg, var(--spp-card-light) 0%, var(--spp-card) 40%, var(--spp-bg) 100%);
  border: 1px solid var(--spp-border);
  border-radius: var(--spp-radius);
  box-shadow:
    0 0 0 1px rgba(212, 168, 67, 0.08),
    0 25px 60px -12px rgba(0,0,0,0.7),
    0 0 80px -20px rgba(230, 0, 18, 0.12);
  transform: scale(0.88) translateY(20px);
  opacity: 0;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
  -webkit-overflow-scrolling: touch;
}
#spp-overlay.spp-active #spp-container {
  transform: scale(1) translateY(0);
  opacity: 1;
}

/* Custom Scrollbar */
#spp-container::-webkit-scrollbar { width: 4px; }
#spp-container::-webkit-scrollbar-track { background: transparent; }
#spp-container::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.12);
  border-radius: 4px;
}

/* Close Button */
.spp-close-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  color: var(--spp-muted);
  font-size: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  z-index: 10;
  line-height: 1;
  font-family: inherit;
  padding: 0;
}
.spp-close-btn:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
  transform: rotate(90deg);
}
.spp-close-btn:focus-visible {
  outline: 2px solid var(--spp-gold);
  outline-offset: 2px;
}

/* Badge */
.spp-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--spp-red), var(--spp-red-dark));
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 14px;
  box-shadow: 0 4px 15px -3px rgba(230, 0, 18, 0.4);
}

/* Image Area */
.spp-image-wrap {
  position: relative;
  margin: 0;
  border-radius: var(--spp-radius) var(--spp-radius) 0 0;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1f35, #0f1325);
  min-height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.spp-image-wrap img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}
.spp-image-fallback {
  padding: 32px 20px;
  text-align: center;
  width: 100%;
}
.spp-event-logo {
  font-size: 28px;
  font-weight: 800;
  color: var(--spp-gold);
  letter-spacing: 4px;
  text-transform: uppercase;
  line-height: 1.2;
  text-shadow: 0 2px 20px rgba(212, 168, 67, 0.25);
}
.spp-event-sub-logo {
  font-size: 11px;
  color: var(--spp-muted);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 8px;
}
.spp-deco-line {
  width: 50px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--spp-gold), transparent);
  margin: 16px auto;
  border-radius: 2px;
}

/* Content Area */
.spp-content {
  padding: 20px 22px 18px;
}
.spp-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--spp-text);
  line-height: 1.35;
  margin: 0 0 8px;
  letter-spacing: -0.3px;
}
.spp-highlight {
  color: var(--spp-gold-light);
}
.spp-subtitle {
  font-size: 13px;
  color: var(--spp-text-secondary);
  line-height: 1.65;
  margin: 0 0 18px;
}

/* Event Info Card */
.spp-event-info {
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--spp-border);
  border-radius: 12px;
  padding: 16px;
  margin: 0 0 20px;
}
.spp-info-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 6px 0;
}
.spp-info-row + .spp-info-row {
  border-top: 1px solid var(--spp-border);
  margin-top: 6px;
  padding-top: 12px;
}
.spp-info-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}
.spp-info-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--spp-muted);
  margin-bottom: 3px;
}
.spp-info-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--spp-text);
  line-height: 1.45;
}

/* Buttons */
.spp-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all 0.3s ease;
  letter-spacing: 0.2px;
  font-family: inherit;
  text-align: center;
}
.spp-btn:focus-visible {
  outline: 2px solid var(--spp-gold);
  outline-offset: 2px;
}
.spp-btn-wa {
  background: linear-gradient(135deg, #25d366, #1da851);
  color: #fff;
  box-shadow: 0 6px 20px -4px rgba(37, 211, 102, 0.4);
  margin-bottom: 10px;
}
.spp-btn-wa:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px -4px rgba(37, 211, 102, 0.5);
}
.spp-btn-wa:active {
  transform: translateY(0);
  box-shadow: 0 4px 12px -2px rgba(37, 211, 102, 0.35);
}
.spp-btn-detail {
  background: transparent;
  color: var(--spp-text);
  border: 1px solid rgba(255,255,255,0.14);
  margin-bottom: 16px;
}
.spp-btn-detail:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.28);
  transform: translateY(-1px);
}
.spp-btn-detail:active {
  transform: translateY(0);
}

/* Checkbox */
.spp-dont-show {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.spp-dont-show input[type="checkbox"] {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--spp-muted);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.spp-dont-show input[type="checkbox"]:checked {
  background: var(--spp-red);
  border-color: var(--spp-red);
}
.spp-dont-show input[type="checkbox"]:checked::after {
  content: '\2713';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}
.spp-dont-show input[type="checkbox"]:focus-visible {
  outline: 2px solid var(--spp-gold);
  outline-offset: 2px;
}
.spp-dont-show label {
  font-size: 12px;
  color: var(--spp-muted);
  cursor: pointer;
  user-select: none;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  #spp-overlay {
    padding: 10px;
    align-items: flex-end;
  }
  #spp-container {
    max-width: 100%;

    border-radius: 16px 16px 10px 10px;
  }
  .spp-content {
    padding: 18px 18px 14px;
  }
  .spp-title {
    font-size: 17px;
  }
  .spp-subtitle {
    font-size: 12px;
  }
  .spp-image-wrap {
    min-height: 130px;
  }
  .spp-event-logo {
    font-size: 22px;
    letter-spacing: 3px;
  }
  .spp-event-sub-logo {
    font-size: 10px;

  }
  .spp-btn {
    padding: 13px 16px;

  }
  .spp-event-info {
    padding: 14px 12px;
  }
  .spp-info-value {
    font-size: 12px;
  }
}

@media (max-height: 640px) {
  #spp-overlay {
    align-items: center;
    padding: 6px;
  }
  #spp-container {
    max-height: 96vh;
  }
  .spp-image-wrap {
    min-height: 100px;
  }
  .spp-image-fallback {
    padding: 20px 16px;
  }
  .spp-event-logo {
    font-size: 20px;
  }
  .spp-event-info {
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .spp-content {
    padding: 14px 18px 12px;
  }
  .spp-title {
    font-size: 16px;

  }
  .spp-subtitle {
    font-size: 11px;

  }
  .spp-btn {
    padding: 11px 14px;

    margin-bottom: 8px;
  }
  .spp-badge {
    margin-bottom: 8px;
    padding: 4px 10px;
    font-size: 9px;
  }
}
</style>

<script>
(function() {
  'use strict';

  /* ==================== KONFIGURASI ==================== */
  var config = {
    active: true,
    version: 'giias-september2026',
    startDate: '2026-08-12',
    endDate: '2026-09-30',
    delay: 2500
  };

  /* Nomor WhatsApp dari config website (tidak diubah) */
  var waNumber = '6285724887779';
  var waMessage = 'Halo, saya tertarik dengan promo Suzuki GIIAS 2026 di Bandung. Saya ingin mendapatkan informasi mengenai harga, promo, dan unit Suzuki yang tersedia.';

  /* Kandidat path gambar - akan dicoba satu per satu */
  var imageCandidates = [
    'images/Popupgias.png',
    'images/giias2026.jpg',
    'images/promo/giias-2026.jpg',
    'images/promo-giias-2026.jpg',
    'images/suzuki-giias.jpg',
    'images/banner-giias.jpg',
    'images/suzuki-giias-2026.jpg'
  ];

  /* ==================== TIMEZONE: ASIA/JAKARTA ==================== */
  function getJakartaDateStr() {
    try {
      /* Menggunakan en-CA untuk format YYYY-MM-DD yang konsisten */
      var parts = new Date().toLocaleString('en-CA', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).split('-');
      return parts[0] + '-' + parts[1] + '-' + parts[2];
    } catch (e) {
      /* Fallback jika browser tidak support timeZone */
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      /* Offset WIB = +7 jam dari UTC */
      var jakarta = new Date(utc + (7 * 3600000));
      var mm = String(jakarta.getMonth() + 1).padStart(2, '0');
      var dd = String(jakarta.getDate()).padStart(2, '0');
      return jakarta.getFullYear() + '-' + mm + '-' + dd;
    }
  }

  /* ==================== VALIDASI AKTIF & PERIODE ==================== */
  if (!config.active) return;

  var todayStr = getJakartaDateStr();

  /* Perbandingan string YYYY-MM-DD: aman tanpa masalah timezone */
  if (todayStr < config.startDate || todayStr > config.endDate) return;

  /* ==================== STORAGE CONTROL ==================== */
  var SP = 'spp_';
  var KEY_VER = SP + 'ver';
  var KEY_DATE = SP + 'date';
  var KEY_SESS = SP + 'sess';

  try {
    /* Jika versi berubah, reset tanggal agar popup tampil lagi */
    if (localStorage.getItem(KEY_VER) !== config.version) {
      localStorage.removeItem(KEY_DATE);
      localStorage.setItem(KEY_VER, config.version);
    }

    /* Cek "jangan tampilkan hari ini" */
    if (localStorage.getItem(KEY_DATE) === todayStr) return;

    /* Cek session: hanya muncul sekali per session */
    if (sessionStorage.getItem(KEY_SESS)) return;
  } catch (e) {
    /* Storage tidak tersedia (private mode, dll) - lanjutkan */
  }

  /* ==================== AMBIL ELEMEN DOM ==================== */
  var overlay = document.getElementById('spp-overlay');
  var container = document.getElementById('spp-container');
  var closeBtn = document.getElementById('spp-close-btn');
  var checkbox = document.getElementById('spp-hide-today');
  var imageWrap = document.getElementById('spp-image-wrap');

  /* Safety: jangan lanjut jika elemen utama tidak ditemukan */
  if (!overlay || !container) return;

  /* ==================== INJECT KONTEN ==================== */
  var titleEl = document.getElementById('spp-title');
  var subtitleEl = document.getElementById('spp-subtitle');
  var waBtn = document.getElementById('spp-wa-btn');
  var detailBtn = document.getElementById('spp-detail-btn');

  if (titleEl) {
    titleEl.innerHTML = '\uD83D\uDD25 <span class="spp-highlight">GIIAS 2026</span> \u2013 Special Suzuki Offer';
  }
  if (subtitleEl) {
    subtitleEl.textContent = 'Dapatkan penawaran spesial Suzuki selama event berlangsung. Booking sekarang dan dapatkan promo terbaik!';
  }

  /* WhatsApp: URL encoding yang benar */
  if (waBtn) {
    waBtn.href = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(waMessage);
  }

  /* Tombol Detail: tutup popup lalu navigasi */
  if (detailBtn) {
    detailBtn.addEventListener('click', function(e) {
      var href = detailBtn.getAttribute('href') || '#produk';
      closePopup();
      /* Beri waktu animasi tutup selesai */
      setTimeout(function() {
        var target = document.querySelector(href);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          window.location.hash = href;
        }
      }, 350);
    });
  }

  /* ==================== SISTEM GAMBAR (dengan fallback) ==================== */
  var imgIdx = 0;

  function tryLoadImage() {
    if (imgIdx >= imageCandidates.length) {
      showImageFallback();
      return;
    }
    var img = new Image();
    img.onload = function() {
      imageWrap.innerHTML = '';
      img.alt = 'GIIAS 2026 Suzuki Exhibition';
      img.style.cssText = 'width:100%;height:auto;display:block;object-fit:cover;';
      imageWrap.appendChild(img);
    };
    img.onerror = function() {
      imgIdx++;
      tryLoadImage();
    };
    img.src = imageCandidates[imgIdx];
  }

  function showImageFallback() {
    /* Fallback visual jika tidak ada gambar yang ditemukan */
    imageWrap.innerHTML =
      '<div class="spp-image-fallback">' +
        '<div class="spp-event-logo">GIIAS 2026</div>' +
        '<div class="spp-deco-line"></div>' +
        '<div class="spp-event-sub-logo">Suzuki Special Exhibition</div>' +
      '</div>';
  }

  tryLoadImage();

  /* ==================== FUNGSI POPUP ==================== */
  var isOpen = false;

  function showPopup() {
    if (isOpen) return;
    isOpen = true;
    overlay.classList.add('spp-active');
    document.body.style.overflow = 'hidden';
    /* Touch lock untuk iOS Safari */
    document.body.style.touchAction = 'none';
    try {
      sessionStorage.setItem(KEY_SESS, '1');
    } catch (e) {}
  }

  function closePopup() {
    if (!isOpen) return;
    isOpen = false;
    overlay.classList.remove('spp-active');
    document.body.style.overflow = '';
    document.body.style.touchAction = '';
    try {
      if (checkbox && checkbox.checked) {
        localStorage.setItem(KEY_DATE, todayStr);
      }
    } catch (e) {}
  }

  /* ==================== EVENT LISTENERS ==================== */
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      closePopup();
    });
  }

  /* Tutup saat klik overlay (di luar container) */
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      closePopup();
    }
  });

  /* Tutup dengan tombol Escape */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) {
      e.preventDefault();
      closePopup();
    }
  });

  /* ==================== INISIALISASI ==================== */
  function init() {
    setTimeout(function() {
      showPopup();
    }, config.delay);
  }

  /* Pastikan DOM dan semua resource sudah siap */
  if (document.readyState === 'complete') {
    init();
  } else {
    window.addEventListener('load', init);
  }

  /* ==================== SAFETY NETS ==================== */

  /* 1. Jika popup elemen dihapus dari DOM secara eksternal, pastikan body scroll kembali */
  var bodyObserver = new MutationObserver(function() {
    if (!document.body.contains(overlay) && isOpen) {
      document.body.style.overflow = '';
      document.body.style.touchAction = '';
      isOpen = false;
    }
  });
  bodyObserver.observe(document.body, { childList: true, subtree: true });

  /* 2. Cleanup observer saat halaman unload */
  window.addEventListener('beforeunload', function() {
    bodyObserver.disconnect();
  });

  /* 3. Double-check: pastikan overflow tidak terkunci setelah animasi selesai */
  overlay.addEventListener('transitionend', function(e) {
    if (e.propertyName === 'opacity' && !overlay.classList.contains('spp-active')) {
      if (document.body.style.overflow === 'hidden') {
        document.body.style.overflow = '';
        document.body.style.touchAction = '';
      }
      isOpen = false;
    }
  });

})();
</script>
